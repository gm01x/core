rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register custom actions.
  appropriate-polling:
    status: exempt
    comment: The integration does not poll; state is kept in memory.
  brands:
    status: exempt
    comment: Internal sample integration without brand assets.
  common-modules:
    status: exempt
    comment: The integration has no coordinator or shared entity base class.
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The integration has no PyPI dependencies.
  docs-actions:
    status: exempt
    comment: Internal sample integration without Home Assistant documentation.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description:
    status: exempt
    comment: Internal sample integration without Home Assistant documentation.
  docs-installation-instructions:
    status: exempt
    comment: Internal sample integration without Home Assistant documentation.
  docs-removal-instructions:
    status: exempt
    comment: Internal sample integration without Home Assistant documentation.
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: The integration does not subscribe to events.
  entity-unique-id: done
  has-entity-name:
    status: exempt
    comment: Virtual sample uses a stable entity name so tests can target climate.temp_controller.
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: The integration has no remote connection to test.
  test-before-setup:
    status: exempt
    comment: The integration has no remote connection to test.
  unique-config-entry: done

